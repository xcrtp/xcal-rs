[workspace]
members = [
    "crates/kernel/ze-notion",
    "crates/kernel/ze-render-ir",
    "crates/kernel/ze-scene-contract",
    "crates/kernel/ze-content",
    "crates/kernel/ze-prerender",
    "crates/kernel/ze-time",
    "crates/kernel/ze-vertex",
    "crates/kernel/ze-resource",
    "crates/kernel/ze-macro",
    "crates/ze/pod/ze-pod-core",
    "crates/ze/pod/ze-pod-binding",
    "crates/ze/pod/ze-pod-macro",
    "crates/ze/pod/ze-pod",
    "crates/object/ze-object",
    "crates/ze/graph/ze-node-core",
    "crates/ze/graph/ze-graph-algo",
    "crates/ze/graph/ze-graph-eval",
    "crates/ze/graph/ze-node-schema",
    "crates/ze/graph/ze-node-schema-macros",
    "crates/ze/graph/ze-node",
    "crates/scene/zela-scene",
    "crates/scene/zela-scene-bundle",
    "crates/ze/pod/ze-pod-lua",
    "crates/ze/pod/ze-pod-py",
    # 测试专用（publish = false）：集成测试 + 基准，不进 wasm gate、不被生产反向依赖。
    "crates/ze/pod/ze-pod-tests",
    "crates/schedule/zela-schedule",
    "crates/render/zela-render",
    "crates/render/zela-render-backends",
    "crates/ui/zela-egui",
    "crates/ui/zela-node-editor",
    "crates/ui/zela-node-egui",
    "crates/ui/zela-node-egui-ui",
    "crates/app/zela-app",
    "crates/app/zela-playback",
    "crates/app/zela-gui",
    "crates/app/zela-compile",
    "crates/web/zela-web",
    "crates/zela/zela",
]
resolver = "2"

# ─── 全仓体检观察项（第 15–18 项，本轮暂不改动）──────────────────────────────
# 15. crate 内模块级循环依赖（ze-graph-eval / ze-node-schema / ze-pod-core / ze-time /
#     zela-render-backends / zela-scene / zela-schedule）：Rust 允许同一编译单元内
#     模块互相 `use`，不是 bug；拆分属于架构调整，不在本轮范围。
# 16. `//!` 模块文档覆盖率约 37%（156/247 缺）：缺口集中在 tests / examples / benches，
#     生产模块优先补齐，不强制一次性补全。
# 17. 外部依赖 `workspace = true` 继承率约 57%：未继承的主要是三个 proc-macro crate 的
#     `syn`（版本同为 2，仅 features 不同）。统一收益有限，暂保留各自声明。
# 18. 生产代码 `unwrap()` 共约 62 处：以 `Mutex::lock().unwrap()` 为主
#     （锁中毒视为不可恢复，属可接受惯例）；其余为"调用方已保证非空/存在"的契约型 unwrap。

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xcrtp/zela"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
] }

egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"

glam = "0.33.6"
pollster = "0.3"

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0" }
# 序列帧导出：最小 PNG 编码器（全仓此前零图像库）。
png = "0.17"
# GPU 测试汇报：直接写 fd 2，绕过 libtest 的输出捕获（见 gpu_test.rs）。
libc = "0.2"

# 可观测性（telemetry feature 下启用）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
derive_more = { version = "2.1.1", features = ["full"] }
thiserror = "2.0.20"
smart-default = "0.7.1"
derive-new = "0.7.0"
derive_builder = "0.20.2"
hecs = "0.11.1"
