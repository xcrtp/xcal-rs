[workspace]
members = [
    "crates/kernel/xc-notion",
    "crates/kernel/xc-render-ir",
    "crates/kernel/xc-scene-contract",
    "crates/kernel/xc-content",
    "crates/kernel/xc-prerender",
    "crates/kernel/xc-time",
    "crates/kernel/xc-vertex",
    "crates/kernel/xc-resource",
    "crates/kernel/xc-macro",
    "crates/pod/xc-pod",
    "crates/pod/xc-pod-binding",
    "crates/pod/xc-pod-macro",
    "crates/object/xc-object",
    "crates/graph/xc-node",
    "crates/graph/xc-graph-algo",
    "crates/graph/xc-graph-eval",
    "crates/graph/xc-node-schema",
    "crates/graph/xc-node-schema-macros",
    "crates/scene/xcal-scene",
    "crates/scene/xcal-scene-bundle",
    "crates/pod/xc-pod-lua",
    "crates/pod/xc-pod-py",
    # 测试专用（publish = false）：集成测试 + 基准，不进 wasm gate、不被生产反向依赖。
    "crates/pod/xc-pod-tests",
    "crates/schedule/xcal-schedule",
    "crates/render/xcal-render",
    "crates/render/xcal-render-backends",
    "crates/ui/xcal-egui",
    "crates/ui/xcal-node-editor",
    "crates/ui/xcal-node-egui",
    "crates/ui/xcal-node-egui-ui",
    "crates/app/xcal-app",
    "crates/app/xcal-playback",
    "crates/app/xcal-gui",
    "crates/app/xcal-compile",
    "crates/web/xcal-web",
]
resolver = "2"

# ─── 全仓体检观察项（第 15–18 项，本轮暂不改动）──────────────────────────────
# 15. crate 内模块级循环依赖（xc-graph-eval / xc-node-schema / xc-pod / xc-time /
#     xcal-render-backends / xcal-scene / xcal-schedule）：Rust 允许同一编译单元内
#     模块互相 `use`，不是 bug；拆分属于架构调整，不在本轮范围。
# 16. `//!` 模块文档覆盖率约 37%（156/247 缺）：缺口集中在 tests / examples / benches，
#     生产模块优先补齐，不强制一次性补全。
# 17. 外部依赖 `workspace = true` 继承率约 57%：未继承的主要是三个 proc-macro crate 的
#     `syn`（版本同为 2，仅 features 不同）。统一收益有限，暂保留各自声明。
# 18. 生产代码 `unwrap()` 共约 62 处：以 `Mutex::lock().unwrap()` 为主
#     （锁中毒视为不可恢复，属可接受惯例）；其余为"调用方已保证非空/存在"的契约型 unwrap。

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
] }

egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"

glam = "0.33.6"
pollster = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
# 序列帧导出：最小 PNG 编码器（全仓此前零图像库）。
png = "0.17"
# GPU 测试汇报：直接写 fd 2，绕过 libtest 的输出捕获（见 gpu_test.rs）。
libc = "0.2"

# 可观测性（telemetry feature 下启用）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
derive_more = { version = "2.1.1", features = ["full"] }
thiserror = "2.0.20"
smart-default = "0.7.1"
derive-new = "0.7.0"
derive_builder = "0.20.2"
hecs = "0.11.1"
