[workspace]
members = [
    "crates/kernel/xc-notion",
    "crates/kernel/xc-render-ir",
    "crates/kernel/xc-scene-contract",
    "crates/kernel/xc-content",
    "crates/kernel/xc-prerender",
    "crates/kernel/xc-time",
    "crates/kernel/xc-vertex",
    "crates/kernel/xc-resource",
    "crates/kernel/xc-macro",
    "crates/kernel/xc-vm",
    "crates/kernel/xc-vm-macro",
    "crates/object/xc-object",
    "crates/graph/xc-node",
    "crates/graph/xc-graph-algo",
    "crates/graph/xc-graph-eval",
    "crates/graph/xc-node-schema",
    "crates/graph/xc-node-schema-macros",
    "crates/scene/xcal-scene",
    "crates/schedule/xcal-schedule",
    "crates/render/xcal-render",
    "crates/render/xcal-render-backends",
    "crates/ui/xcal-egui",
    "crates/ui/xcal-node-editor",
    "crates/ui/xcal-node-egui",
    "crates/ui/xcal-node-egui-ui",
    "crates/app/xcal-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
] }

egui = "0.36"
egui-wgpu = "0.36"
wgpu = "30"

nalgebra = "0.33"
glam = "0.33.6"
pollster = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml = { version = "1.0" }
# 序列帧导出：最小 PNG 编码器（全仓此前零图像库）。
png = "0.17"
# GPU 测试汇报：直接写 fd 2，绕过 libtest 的输出捕获（见 gpu_test.rs）。
libc = "0.2"

# 可观测性（telemetry feature 下启用）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
derive_more = { version = "2.1.1", features = ["full"] }
thiserror = "2.0.20"
smart-default = "0.7.1"
derive-new = "0.7.0"
derive_builder = "0.20.2"
hecs = "0.11.1"
