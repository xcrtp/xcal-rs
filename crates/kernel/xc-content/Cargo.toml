[package]
name = "xc-content"
version.workspace = true
edition.workspace = true
license.workspace = true

# kernel 层轻 crate：IR 数据类型 + SVG 序列化 + 占位生成器。
# 禁止依赖 typst / egui / wgpu / hecs。

[dependencies]
xc-geometry = { path = "../xc-geometry" }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "xc-geometry/serde"]
