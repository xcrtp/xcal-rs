[package]
name = "xc-vm"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "VM 统一抽象：不透明状态机 + capability 协商 + 函数集合（零依赖 kernel crate）"

# 依赖铁律：xc-vm 在 kernel 层
#   ❌ hecs / egui / wgpu / 任何 xcal-* / 任何外部依赖 —— 绝对禁止（纯 std，必须能编译到 wasm32）。
#   需要 proc-macro 的 `#[capability]` 留在独立的 xc-vm-macro（Rust 硬性要求）。
#   `xc-vm` 不得依赖 `xc-node`：类型名机制与 `xc-node::TypeTag::type_name()` 形态同构，
#   但零依赖约束下只能内建（见 §6 交付说明）。
