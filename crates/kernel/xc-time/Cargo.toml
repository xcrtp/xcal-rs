[package]
name = "xc-time"

version.workspace = true
edition.workspace = true
license.workspace = true

description = "Pure-logic clock tree + animation curves + director (zero render/UI deps)"

# 依赖铁律：xc-time 在 kernel 层
#   ✅ glam — 数学类型（Vec2/Vec3）+ serde feature 让 Vec2/Vec3 可序列化
#   ✅ serde — 序列化（ClockForest / Curve 可导出）
#   ✅ thiserror — 错误类型
#   ❌ hecs / egui / wgpu / 任何 xcal-* — 绝对禁止
[dependencies]
glam = { workspace = true, features = ["serde"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
