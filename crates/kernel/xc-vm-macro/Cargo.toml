[package]
name = "xc-vm-macro"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "xc-vm 的 proc-macro：#[capability]（生成持有 &dyn Vm 的 capability struct）"

# proc-macro 必须独立 crate（Rust 硬性要求）；xc-vm 本身保持零依赖。
[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
xc-vm = { path = "../xc-vm" }
