[package]
name = "xc-notion"

version.workspace = true
edition.workspace = true
license.workspace = true

# 纯数据层：零 trait object、零后端依赖，仅依赖 glam 数学库。
# egui / wgpu 等渲染相关依赖一律禁止出现在此 crate。
[dependencies]
glam.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "glam/serde"]
