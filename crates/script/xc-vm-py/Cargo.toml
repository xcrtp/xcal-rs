[package]
name = "xc-vm-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "纯 Python 适配器（pyo3，feature 门控）：重解释器只承担装配期的活"

[features]
default = []
# 需要系统 Python（或 pyo3 的 abi3 目标）。默认不带：CI 的零运行时依赖不受影响。
python = ["dep:pyo3"]

[dependencies]
# 只依赖机制层：**生产边不含任何 `xcal-*`**。
xc-vm = { path = "../../kernel/xc-vm" }
xc-vm-binding = { path = "../../kernel/xc-vm-binding" }
xc-vm-macro = { path = "../../kernel/xc-vm-macro" }

pyo3 = { version = "0.30", optional = true, features = ["auto-initialize"] }
