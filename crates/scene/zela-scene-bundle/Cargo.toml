[package]
name = "zela-scene-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZSB 场景装配产物：格式 + 读写 + 内容 hash + 可还原性检查（无脚本依赖）"

[dependencies]
# 装配产物 = `SceneScript`（声明式创建 + 时间线）。本 crate **不依赖任何语言适配器**：
# 浏览器侧只引这一个轻 crate 即可回放。
zela-scene-ecs = { path = "../zela-scene-ecs" }
# B4 Step 2：Meta 承载渲染参数（纯数据，kernel 层，不引入 GPU 依赖）。
ze-render-ir = { path = "../../kernel/ze-render-ir" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# 测试构造一个最小装配产物（Circle 组件）。
ze-scene-core = { path = "../../scene/ze-scene-core" }
