[package]
name = "xcal-scene-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XSB 场景装配产物：格式 + 读写 + 内容 hash + 可还原性检查（无脚本依赖）"

[dependencies]
# 装配产物 = `SceneScript`（声明式创建 + 时间线）。本 crate **不依赖任何语言适配器**：
# 浏览器侧只引这一个轻 crate 即可回放。
xcal-scene = { path = "../xcal-scene" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# 测试构造一个最小装配产物（Circle 组件）。
xc-object = { path = "../../object/xc-object" }
