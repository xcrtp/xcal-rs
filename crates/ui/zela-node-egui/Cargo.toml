[package]
name = "zela-node-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui rendering and interaction layer for zela-node-editor"

[dependencies]
zela-node-editor = { path = "../zela-node-editor" }
ze-node-core = { path = "../../ze/graph/ze-node-core" }
egui = { workspace = true }
glam = { workspace = true }
# 交互失败不能静默（delete / connect / move 被拒绝时给出诊断）。
tracing = { workspace = true }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts"] }
ze-node-core = { path = "../../ze/graph/ze-node-core" }
ze-node-schema = { path = "../../ze/graph/ze-node-schema" }
ze-node-schema-macros = { path = "../../ze/graph/ze-node-schema-macros" }
zela-node-egui-ui = { path = "../zela-node-egui-ui" }
ze-graph-eval = { path = "../../ze/graph/ze-graph-eval" }
ze-graph-algo = { path = "../../ze/graph/ze-graph-algo" }
glam = { workspace = true }
