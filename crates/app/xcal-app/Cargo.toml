[package]
name = "xcal-app"

version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xcal-app"
path = "src/main.rs"

[dependencies]
xcal-scene = { path = "../../render/xcal-scene" }
# ECS 调度内核 + Telemetry（Scheduler / Resources / System / ExecutorContext / 日志 / 快照）。
xcal-schedule = { path = "../../schedule/xcal-schedule" }
xcal-render = { path = "../../render/xcal-render" }
# RenderContext / WgpuBackend3D / WgpuBackend2D / SceneCompositorCallback / EguiPainter 等具体后端实现。
xcal-render-backends = { path = "../../render/xcal-render-backends", features = ["egui-wgpu"] }
xcal-egui = { path = "../../ui/xcal-egui" }
xc-macro = { path = "../../kernel/xc-macro" }
# 内容管线接线：xc-content（IR 类型）+ xc-prerender（Typst/占位引擎）。
# 铁律：xcal-render 只能依赖轻的 xc-content，不得依赖 xc-prerender——
# 这里是 app 层，可以直连两者。
xc-content = { path = "../../kernel/xc-content" }
xc-prerender = { path = "../../kernel/xc-prerender", default-features = false }
# 几何原语：S1 形变 demo 需要直接构造 Path2D（MorphShape 的 from/to）。
xc-geometry = { path = "../../kernel/xc-geometry" }

eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
hecs.workspace = true
glam.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
tracing.workspace = true

[features]
# typst 默认开：否则看不见真公式，demo 无意义。
# 关闭时 xc-prerender 用 placeholder 引擎兜底（显示方块），链路照样跑通。
default = ["typst"]
typst = ["xc-prerender/typst"]
