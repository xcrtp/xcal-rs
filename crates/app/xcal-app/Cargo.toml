[package]
name = "xcal-app"

version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xcal-render"
path = "src/bin/xcal-render.rs"

[dependencies]
xcal-scene = { path = "../../scene/xcal-scene" }
# Pod 机制 + 静态插件装配（src/assembly.rs）。
xc-pod = { path = "../../pod/xc-pod" }
xc-pod-binding = { path = "../../pod/xc-pod-binding" }
# Lua 适配器（纯语言层）：`--script` 用 Lua 编排最小分镜。
xc-pod-lua = { path = "../../pod/xc-pod-lua" }
# Python 适配器：只在 feature = "python" 时引入，默认构建不受 pyo3 影响。
xc-pod-py = { path = "../../pod/xc-pod-py", optional = true }
# ECS 调度内核 + Telemetry（Scheduler / Resources / System / ExecutorContext / 日志 / 快照）。
xcal-schedule = { path = "../../schedule/xcal-schedule" }
xcal-render = { path = "../../render/xcal-render" }
# RenderContext / WgpuBackend3D / WgpuBackend2D / SceneCompositorCallback 等具体后端实现。
xcal-render-backends = { path = "../../render/xcal-render-backends", features = ["egui-wgpu"] }
xc-macro = { path = "../../kernel/xc-macro" }
# 内容管线接线：xc-content（IR 类型）+ xc-prerender（Typst/占位引擎）。
# 铁律：xcal-render 只能依赖轻的 xc-content，不得依赖 xc-prerender——
# 这里是 app 层，可以直连两者。
xc-content = { path = "../../kernel/xc-content" }
xc-prerender = { path = "../../kernel/xc-prerender", default-features = false }
# 几何原语：S1 形变 demo 需要直接构造 Path2D（MorphShape 的 from/to）。
xc-notion = { path = "../../kernel/xc-notion" }
# 场景对象层：图元 newtype 与摆放组件（Circle / Path / Line / Rect / Transform）。
xc-object = { path = "../../object/xc-object" }

wgpu.workspace = true
hecs.workspace = true
glam.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
tracing.workspace = true
# 序列帧导出（B 线）：最小 PNG 编码器。
png.workspace = true

[dev-dependencies]
# 像素一致性用例直接驱动 egui-wgpu 的回调路径（不是生产依赖）。
egui-wgpu.workspace = true

[features]
# typst 默认开：否则看不见真公式，demo 无意义。
# 关闭时 xc-prerender 用 placeholder 引擎兜底（显示方块），链路照样跑通。
# python 默认开：Python Pod 是默认装配的一部分（`--python` 跑 Python 分镜）；
# 关闭后 `--script`（Lua）仍可用，只是没有 Python 节点。
default = ["typst", "python"]
typst = ["xc-prerender/typst"]
# Python 双向对称性用例 + Python 分镜（需要系统 Python）。
python = ["dep:xc-pod-py", "xc-pod-py/python"]
