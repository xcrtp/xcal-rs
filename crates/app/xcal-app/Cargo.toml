[package]
name = "xcal-app"

version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xcal-app"
path = "src/main.rs"

[dependencies]
xcal-core = { path = "../../render/xcal-core", features = ["egui"] }
xcal-render = { path = "../../render/xcal-render" }
# RenderContext / WgpuBackend3D / Layer3DCallback / EguiPainter 等具体后端实现。
xcal-render-backends = { path = "../../render/xcal-render-backends", features = ["egui-wgpu"] }
xcal-egui = { path = "../../ui/xcal-egui" }
xcal-macro = { path = "../../ui/xcal-macro" }

eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
hecs.workspace = true
glam.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
tracing.workspace = true
