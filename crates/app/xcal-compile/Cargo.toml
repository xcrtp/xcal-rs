[package]
name = "xcal-compile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "XSB 独立编译器：脚本 → 装配产物（.xsb）"

[[bin]]
name = "xcal-compile"
path = "src/main.rs"

[dependencies]
# 复用组装层的装配路径（与 GUI / --script 完全相同）。
xcal-app = { path = "../xcal-app", default-features = false }
xcal-scene-bundle = { path = "../../scene/xcal-scene-bundle" }

[features]
# 与 xcal-app 对齐：默认开 Typst（真公式）与 Python（.py 编译）。
default = ["typst", "python"]
typst = ["xcal-app/typst"]
python = ["xcal-app/python"]
