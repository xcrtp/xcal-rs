[package]
name = "zela-app"

version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zela-render"
path = "src/bin/zela-render.rs"

[dependencies]
zela-scene = { path = "../../scene/zela-scene" }
# B3-1e：场景作品（分镜 / demo）独立成 crate。
zela-authored = { path = "../zela-authored" }
# ZSB 装配产物（格式 + 可还原性检查）。不依赖任何语言适配器。
zela-scene-bundle = { path = "../../scene/zela-scene-bundle" }
# Pod 机制 + 静态插件装配（src/assembly.rs）。
ze-pod-core = { path = "../../ze/pod/ze-pod-core" }
ze-pod-binding = { path = "../../ze/pod/ze-pod-binding" }
# Lua 适配器（纯语言层）：`--script` 用 Lua 编排最小分镜。
ze-pod-lua = { path = "../../ze/pod/ze-pod-lua" }
# Python 适配器：只在 feature = "python" 时引入，默认构建不受 pyo3 影响。
ze-pod-py = { path = "../../ze/pod/ze-pod-py", optional = true }
# ECS 调度内核 + Telemetry（Scheduler / Resources / System / ExecutorContext / 日志 / 快照）。
zela-schedule = { path = "../../schedule/zela-schedule" }
# 回放运行时（ZSB → Scene → 调度器 → 帧回调）：浏览器与 `--bundle` 共用装配尾。
zela-playback = { path = "../zela-playback" }
zela-render = { path = "../../render/zela-render" }
# RenderContext / WgpuBackend3D / WgpuBackend2D / SceneCompositorCallback 等具体后端实现。
zela-render-backends = { path = "../../render/zela-render-backends", features = ["egui-wgpu"] }
ze-macro = { path = "../../kernel/ze-macro" }
# 内容管线接线：ze-content（IR 类型）+ ze-prerender（Typst/占位引擎）。
# 铁律：zela-render 只能依赖轻的 ze-content，不得依赖 ze-prerender——
# 这里是 app 层，可以直连两者。
ze-content = { path = "../../kernel/ze-content" }
ze-prerender = { path = "../../kernel/ze-prerender", default-features = false }
# 几何原语：S1 形变 demo 需要直接构造 Path2D（MorphShape 的 from/to）。
ze-notion = { path = "../../kernel/ze-notion" }
# 场景对象层：图元 newtype 与摆放组件（Circle / Path / Line / Rect / Transform）。
ze-scene-core = { path = "../../scene/ze-scene-core" }

wgpu.workspace = true
hecs.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
tracing.workspace = true
# 序列帧导出（B 线）：最小 PNG 编码器。
png.workspace = true

[dev-dependencies]
# 像素一致性用例直接驱动 egui-wgpu 的回调路径（不是生产依赖）。
egui-wgpu.workspace = true

[features]
# typst 默认开：否则看不见真公式，demo 无意义。
# 关闭时 ze-prerender 用 placeholder 引擎兜底（显示方块），链路照样跑通。
# python 默认开：Python Pod 是默认装配的一部分（`--python` 跑 Python 分镜）；
# 关闭后 `--script`（Lua）仍可用，只是没有 Python 节点。
default = ["typst", "python"]
typst = ["ze-prerender/typst"]
# Python 双向对称性用例 + Python 分镜（需要系统 Python）。
python = ["dep:ze-pod-py", "ze-pod-py/python"]
