[package]
name = "ze-pod-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "纯 Lua 适配器（mlua）：能力注入 + 宿主→脚本入口"

[dependencies]
# 只依赖机制层：**生产边不含任何 `zela-*`**。
ze-pod-core = { path = "../ze-pod-core", version = "0.1.1" }
ze-pod-binding = { path = "../ze-pod-binding", version = "0.1.1" }

# Lua 5.4 解释器**编进二进制**（vendored）⇒ 部署零运行时依赖。
mlua = { version = "0.12", default-features = false, features = [
    "lua54",
    "vendored",
] }

[dev-dependencies]
# 测试自建 mini domain Pod（dev 边不计入生产依赖图）。
ze-pod-macro = { path = "../ze-pod-macro" }
serde_json.workspace = true
