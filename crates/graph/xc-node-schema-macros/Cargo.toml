[package]
name = "xc-node-schema-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macro support for xc-node-schema: #[derive(NodeSpec)] + #[property]."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
xc-node-schema = { path = "../xc-node-schema" }
xc-node = { path = "../xc-node" }
xc-graph-eval = { path = "../xc-graph-eval" }
xc-graph-algo = { path = "../xc-graph-algo" }
