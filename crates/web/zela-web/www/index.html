<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zela-web · demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0d; color: #d7d7db; }
    body { display: flex; align-items: center; justify-content: center; font: 14px/1.5 system-ui, sans-serif; }
    #zela-canvas { width: min(100vw, 1280px); height: auto; image-rendering: pixelated; background: #000; }
    #zela-toolbar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; max-width: calc(100vw - 24px);
      padding: 6px 10px; background: rgba(0,0,0,.65); border: 1px solid #333; border-radius: 6px; }
    #zela-toolbar label { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
    #zela-toolbar select, #zela-toolbar input { font: inherit; color: inherit; background: #17171a;
      border: 1px solid #3a3a40; border-radius: 4px; padding: 2px 6px; }
    #zela-toolbar button, #zela-toolbar a { font: inherit; color: inherit; background: #17171a;
      border: 1px solid #3a3a40; border-radius: 4px; padding: 2px 8px; text-decoration: none; cursor: pointer; }
    #zela-toolbar button:disabled { opacity: .45; cursor: default; }
    #zela-toolbar a:hover, #zela-toolbar button:not(:disabled):hover { border-color: #6a6a75; }
    #zela-status { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px;
      background: rgba(0,0,0,.65); border: 1px solid #333; border-radius: 6px;
      font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  </style>
</head>
<body>
  <canvas id="zela-canvas" width="640" height="480"></canvas>

  <div id="zela-toolbar">
    <label>作品
      <select id="zela-demo" disabled>
        <option>加载清单…</option>
      </select>
    </label>
    <label>上传
      <input id="zela-file" type="file" accept=".zsb" disabled>
    </label>
    <label>速度
      <select id="zela-speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </label>
    <label>后端
      <select id="zela-backend">
        <option value="auto" selected>自动（按能力）</option>
        <option value="wgpu">wgpu</option>
        <option value="vector">矢量</option>
      </select>
    </label>
    <button id="zela-replay" type="button" disabled>重播</button>
    <a id="zela-commit" href="https://github.com/xcrtp/zela" target="_blank" rel="noreferrer" hidden>commit …</a>
    <a id="zela-repo" href="https://github.com/xcrtp/zela" target="_blank" rel="noreferrer">GitHub 仓库</a>
  </div>

  <div id="zela-status">初始化…</div>

  <!-- vConsole v3.15.1（MIT，Tencent）本地内置：移动端没有桌面控制台时也能看日志。
       默认只在移动端自动打开；?vconsole=1 强制打开、?vconsole=0 关闭（桌面调试同法）。 -->
  <script src="./vendor/vconsole.min.js"></script>
  <script>
    (() => {
      const forced = new URLSearchParams(location.search).get('vconsole');
      const mobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 1 && window.matchMedia
            && window.matchMedia('(pointer: coarse)').matches);
      if (forced === '0' || !window.VConsole || !(forced === '1' || mobile)) return;
      // 不装 network 插件（列表里只留 system / element / storage）：它会包装
      // window.fetch，导致 wasm-bindgen 的 `instantiateStreaming` 拿到不可用的
      // Response（实测报 "compile ... must be a Response or Promise<Response>"）。
      window.__vconsole = new window.VConsole({
        theme: 'dark',
        defaultPlugins: ['system', 'element', 'storage'],
        log: { maxLogNumber: 2000 },
      });
    })();
  </script>

  <script type="module">
    import init, { start, start_with_bytes, set_speed, set_backend } from './pkg/zela_web.js';

    const status = document.getElementById('zela-status');
    const select = document.getElementById('zela-demo');
    const fileInput = document.getElementById('zela-file');
    const speedSelect = document.getElementById('zela-speed');
    const replayButton = document.getElementById('zela-replay');
    const backendSelect = document.getElementById('zela-backend');
    const commitLink = document.getElementById('zela-commit');

    // B11：后端偏好（auto / wgpu / vector）。切换 = Rust 侧重播，不整页重载。
    const BACKEND_KEY = 'zela-backend';
    const savedBackend = localStorage.getItem(BACKEND_KEY);
    if (savedBackend && ['auto', 'wgpu', 'vector'].includes(savedBackend)) {
      backendSelect.value = savedBackend;
    }

    const REPO_URL = 'https://github.com/xcrtp/zela';

    // 与 Rust 侧上限一致；**Rust 仍是权威校验**（这里避免超大文件先进 wasm 内存）。
    const MAX_BUNDLE_BYTES = 32 * 1024 * 1024;

    let playing = false;
    let demos = [];
    // 重播目标：作品（按当前 URL 重新 fetch）或上传的字节（留在内存里）。
    let lastKind = 'demo';
    let lastBytes = null;
    let wasmReady = false;
    // compare 模式强制 1×（Rust 侧保证），禁用速度选择避免误导。
    const isCompare = new URL(location.href).searchParams.get('compare') === '1';
    if (isCompare) speedSelect.disabled = true;

    function setBusy(busy) {
      playing = busy;
      // **播放中也能切作品**：切换只改 `?zsb=` 并整页重载（旧帧循环随页面一起丢弃），
      // 因此不需要等播放结束。只有"清单为空"时才禁用下拉。
      select.disabled = demos.length === 0;
      fileInput.disabled = busy;
      replayButton.disabled = busy;
    }

    function fail(error) {
      status.textContent = `错误：${error}`;
      console.error(error);
    }

    // 切换作品：改 `?zsb=` 并重载（Rust 入口统一从 URL 取路径）。
    function reloadWith(zsb) {
      const url = new URL(location.href);
      url.search = '';
      url.searchParams.set('zsb', zsb);
      location.href = url.toString();
    }

    async function loadDemos() {
      try {
        const response = await fetch('./demos.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        demos = Array.isArray(data) ? data : [];
      } catch (error) {
        console.warn(`demos.json 不可用，保留默认作品：${error}`);
        demos = [];
      }

      select.replaceChildren();
      for (const demo of demos) {
        const option = document.createElement('option');
        option.value = demo.zsb;
        option.textContent = demo.title || demo.id;
        select.append(option);
      }
      if (demos.length === 0) {
        const option = document.createElement('option');
        option.textContent = '默认作品';
        select.append(option);
      }

      const current = new URL(location.href).searchParams.get('zsb');
      if (current && demos.some((demo) => demo.zsb === current)) {
        select.value = current;
      }
      select.disabled = demos.length === 0;
    }

    select.addEventListener('change', () => {
      // 播放中切换：直接重载到新作品（旧的 wasm 帧循环由导航终止，无需先 stop）。
      reloadWith(select.value);
    });

    fileInput.addEventListener('change', async () => {
      const [file] = fileInput.files || [];
      if (!file) return;
      if (file.size > MAX_BUNDLE_BYTES) {
        status.textContent = `错误：ZSB 文件过大：${file.size} B（上限 ${MAX_BUNDLE_BYTES} B）`;
        fileInput.value = '';
        return;
      }

      setBusy(true);
      status.textContent = `读取 ${file.name} …`;
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        await start_with_bytes(bytes);
        // 只有播放成功才把它设为重播目标（坏文件不应覆盖上一次可播的作品）。
        lastKind = 'upload';
        lastBytes = bytes;
      } catch (error) {
        fail(error);
      } finally {
        fileInput.value = '';
        setBusy(false);
      }
    });

    async function restartPlayback() {
      if (playing) return;
      setBusy(true);
      status.textContent = '重播…';
      try {
        if (lastKind === 'upload' && lastBytes) {
          await start_with_bytes(lastBytes);
        } else {
          // 作品：按当前 `?zsb=` 重新 fetch，compare 等 URL 语义保持不变。
          await start();
        }
      } catch (error) {
        fail(error);
      } finally {
        setBusy(false);
      }
    }

    replayButton.addEventListener('click', restartPlayback);

    // 切后端：Rust 侧重播当前作品（同一块 device，不重新 fetch、不整页重载）。
    backendSelect.addEventListener('change', () => {
      localStorage.setItem(BACKEND_KEY, backendSelect.value);
      if (!wasmReady) return;
      try {
        set_backend(backendSelect.value);
      } catch (error) {
        fail(error);
      }
    });

    // 播放中：帧循环每个 rAF 读取速度，即时生效；已结束：按新速度重播。
    speedSelect.addEventListener('change', async () => {
      if (!wasmReady) return;
      set_speed(Number(speedSelect.value));
      if (!playing) await restartPlayback();
    });

    // 显示构建所用的提交哈希，并链接到 GitHub 对应 commit 页面。
    async function loadBuildInfo() {
      try {
        const response = await fetch('./build.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const info = await response.json();
        const commit = String(info.commit || '');
        if (!/^[0-9a-f]{40}$/i.test(commit)) return;
        commitLink.textContent = commit.slice(0, 7) + (info.dirty ? '+' : '');
        commitLink.title = info.dirty ? `${commit}（工作区有未提交改动）` : commit;
        commitLink.href = `${REPO_URL}/commit/${commit}`;
        commitLink.hidden = false;
      } catch (error) {
        console.warn(`build.json 不可用：${error}`);
      }
    }

    await loadDemos();
    await loadBuildInfo();

    try {
      await init();
      wasmReady = true;
      set_speed(Number(speedSelect.value));
      // 把 localStorage 里的后端偏好交给 Rust（尚未加载产物 ⇒ 只记偏好，不重播）。
      set_backend(backendSelect.value);
      // 没有 `?zsb=` 时与列表选择保持一致：默认播放清单第一项。
      const url = new URL(location.href);
      if (!url.searchParams.get('zsb') && demos.length > 0) {
        url.searchParams.set('zsb', demos[0].zsb);
        history.replaceState(null, '', url);
      }
      setBusy(true);
      await start();
    } catch (error) {
      fail(error);
    } finally {
      setBusy(false);
    }
  </script>
</body>
</html>
