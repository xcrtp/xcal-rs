[package]
name = "ze-pod-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Pod 层集成测试与基准（不进 wasm gate、不参与发布、不被任何生产 crate 依赖）"

# 这是**测试专用** crate：
# - 同时依赖核心组（ze-pod / ze-pod-macro / ze-pod-binding）与两个语言适配器；
# - 任何生产 crate 都不得反向依赖它（没有消费方，也不应出现）。
#
# Python 侧**默认不启用**：`ze-pod-py` 的 `python` feature 需要系统 Python。
# 默认 `cargo test -p ze-pod-tests` 只验证核心组 + Lua + 两侧共用的代码生成；
# 跑 Python 执行用例须显式 `--features python`
# （本机环境变量见交付说明：PYO3_PYTHON / PYTHONHOME）。
[features]
default = []
python = ["ze-pod-py/python"]

[dependencies]
ze-pod = { path = "../ze-pod" }
ze-pod-macro = { path = "../ze-pod-macro" }
ze-pod-binding = { path = "../ze-pod-binding" }
ze-pod-lua = { path = "../ze-pod-lua" }
# 默认不带 `python` feature ⇒ 不触发 pyo3 / 系统 Python 依赖。
ze-pod-py = { path = "../ze-pod-py" }

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true

[[bench]]
name = "pod_bench"
harness = false
