[package]
name = "zela-render"

version.workspace = true
edition.workspace = true
license.workspace = true

# trait + 调度 + 资源管理层。
# 依赖方向：ze-notion / zela-scene ← zela-render ← zela-render-backends
# 本 crate 禁止依赖 egui；**也不再依赖 wgpu**（B3-0.5e：GPU 侧模块已迁入
# zela-render-backends，本 crate 是纯渲染无关层）。
[dependencies]
# B3-1 收尾：渲染层不再依赖场景 **ECS 实现**（`zela-scene-ecs`）。
# 录制 System 只需要 `SceneRead` 适配器 —— 它来自 `ze-scene-hecs`（纯适配层）。
ze-scene-hecs = { path = "../../scene/ze-scene-hecs" }
# 调度内核：三个录制 System（record_systems.rs，P4 从 zela-egui 归位到渲染层）
# 需要 `System` / `ExecutorContext`。
zela-schedule = { path = "../../schedule/zela-schedule" }
ze-notion = { path = "../../kernel/ze-notion" }
# 渲染 IR 层（Shape2D / Style2D / 样式组件 / 降级 trait）已下沉 kernel/ze-render-ir。
ze-render-ir = { path = "../../kernel/ze-render-ir" }
# 场景对象层（图元 newtype）：Circle / Path / Line / Rect 的定义在此。
ze-scene-core = { path = "../../scene/ze-scene-core" }
# 契约层：`record_scene<S: Scene>` 的唯一入参抽象（M3-7 —— 本 crate 无 hecs）。
ze-scene-contract = { path = "../../kernel/ze-scene-contract" }
ze-content = { path = "../../kernel/ze-content" }
# 渲染契约层已下沉 kernel：
#   ze-vertex   ← vertex/（顶点格式契约，纯数据）
#   ze-resource ← resource_cache / render_backend 的纯数据部分（GpuHandle / ResourceKey / ...）
# 本 crate 通过 `pub use ze_vertex as vertex;` 与 shim 模块保留原有公开路径。
ze-vertex = { path = "../../kernel/ze-vertex" }
ze-resource = { path = "../../kernel/ze-resource" }

derive_more.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
thiserror.workspace = true
# 顶点格式契约（vertex 模块）：VertexLayout 需可序列化（V4，pipeline 变体缓存 key 前置）
serde.workspace = true

lyon_tessellation = "1.0"
lyon_path = "1.0"

[dev-dependencies]
serde_json.workspace = true
# ⚠️ 仅测试用：录制 System 的用例要驱动 `Scheduler`（容器是 `hecs::World`）。
# 库本体**不认识 hecs**（M3-7 纪律）—— `record_scene` 只吃契约层 `SceneRead`。
hecs.workspace = true

[features]
# B3-0.5e：wgpu feature 已删除（GPU 侧模块迁入 zela-render-backends）。
default = []
