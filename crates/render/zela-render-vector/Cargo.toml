[package]
name = "zela-render-vector"
version.workspace = true
edition.workspace = true
# 多许可：MIT（多数文件）+ Apache-2.0（来自 AOSP / Filament 的着色栈）。
# 逐文件归属见 UPSTREAM.md 与每个文件头部的 SPDX 行。
license = "MIT OR Apache-2.0"
description = "矢量后端（移植自 manimgx）：解析抗锯齿的路径光栅化 + 3D 着色栈。上游 SHA 见 UPSTREAM.md"
publish = false

# 许可证基线（B4 Step 3）：
# - LICENSES/MIT.txt / LICENSES/Apache-2.0.txt 逐字来自上游 `manimgx/LICENSES/`；
# - 每个移植文件**必须**带 SPDX 头（上游无头的文件由我们补齐），修改处追加
#   `// Modified by Zela: …`；
# - `UPSTREAM.md` 记录 upstream commit SHA 与逐文件许可清单。

[dependencies]
# 移植范围只开 `render`：python / typeset / export / window / web 一律不开，
# 因此 pyo3 / typst / x264(GPL) / ffmpeg(LGPL) / winit / cpal 都不会进入依赖树。
wgpu.workspace = true
bytemuck = { version = "1.25", features = ["derive", "extern_crate_alloc", "min_const_generics"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
thiserror.workspace = true
serde.workspace = true
# 上游 `Gpu::new()` 用 `pollster::block_on` 起 GPU（与本仓库其它后端同一做法）。
pollster = "1.0.1"

# B4 场景适配（V2-06）：把 zela 的 2D 图元映射成上游的 `Record`。
# **只依赖 kernel 层**（ze-notion / ze-render-ir），不依赖任何 `zela-*`：
# `zela-render-backends` 对它是 dev-dependency，生产依赖图保持不变（B4 验收 §1.3）。
ze-notion = { path = "../../kernel/ze-notion" }
ze-render-ir = { path = "../../kernel/ze-render-ir" }

[features]
# 本 crate 即矢量渲染色；`render` 默认开启（保留上游 `#[cfg(feature = "render")]` 标注）。
default = ["render"]
render = []
# 上游代码里保留的 feature 名（本 crate **不启用**）：声明出来只为让
# `cfg(feature = ...)` 合规，不引入任何依赖。
python = []
player = []
export = []
