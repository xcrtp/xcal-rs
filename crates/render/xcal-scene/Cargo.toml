[package]
name = "xcal-scene"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xc-macro = { path = "../../kernel/xc-macro" }
xc-notion = { path = "../../kernel/xc-notion" }
# 场景对象层（图元 newtype）：组件词汇由对象层定义，本层（ECS 实现）只消费。
xc-object = { path = "../../object/xc-object" }
# 渲染 IR（样式组件）：ECS 里存的 `StrokeSolid` / `FillSolid` 组件来自此处。
xc-render-ir = { path = "../../kernel/xc-render-ir" }
# 契约层（M3-7/M3-8）：本层为 `xc_scene_contract::Scene` 提供 hecs 实现，
# 从而渲染管线与装配对象不再认识 hecs。
xc-scene-contract = { path = "../../kernel/xc-scene-contract" }
xc-time = { path = "../../kernel/xc-time" }
xcal-schedule = { path = "../../schedule/xcal-schedule" }

glam.workspace = true
derive_more.workspace = true
thiserror.workspace = true
smart-default.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
hecs.workspace = true

[dev-dependencies]
glam.workspace = true
