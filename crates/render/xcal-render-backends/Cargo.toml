[package]
name = "xcal-render-backends"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xcal-scene = { path = "../xcal-scene", default-features = false }
xcal-render = { path = "../xcal-render", default-features = false }
xc-geometry = { path = "../../kernel/xc-geometry" }

glam.workspace = true
hecs.workspace = true
thiserror.workspace = true
pollster = { workspace = true, optional = true }

# wgpu / egui 均为可选：按 feature 组合提供后端实现。
wgpu = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[dev-dependencies]
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
glam.workspace = true

[[example]]
name = "cube_3d"
required-features = ["egui-wgpu"]

[features]
# 默认启用 wgpu：让 `cargo test -p xcal-render-backends`（顶点契约 V6 验收命令）
# 能编译并运行 vertex_layout 翻译层测试；纯翻译层测试不创建 GPU 实例，headless 可跑。
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster", "xcal-render/wgpu"]
# egui + wgpu 集成（egui_wgpu 回调、EframeWgpuBackend、RenderContext）。
# `dep:egui` 为必需项——回调整合依赖 egui 类型。
egui-wgpu = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wgpu",
    "dep:pollster",
    "xcal-render/wgpu",
]
# 文本引擎（Typst/LaTeX）预留。
text = []
