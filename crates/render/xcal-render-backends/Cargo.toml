[package]
name = "xcal-render-backends"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xcal-render = { path = "../xcal-render", default-features = false }
xc-notion = { path = "../../kernel/xc-notion" }
# 场景对象层：相机与图元（Camera2D / Camera3D / Projection / Rect / …）的定义在此。
xc-object = { path = "../../object/xc-object" }
# S2：图层合成概念与 3D 渲染描述符已下沉渲染 IR 层；后端不再直接依赖 xcal-scene。
xc-render-ir = { path = "../../kernel/xc-render-ir" }

glam.workspace = true
thiserror.workspace = true
pollster = { workspace = true, optional = true }
# GPU 测试汇报：直接写 fd 2，绕过 libtest 的线程输出捕获。
libc.workspace = true

# wgpu / egui 均为可选：按 feature 组合提供后端实现。
wgpu = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[dev-dependencies]
# 仅测试：像素级用例要构造真实 ECS 场景（生产边不得依赖 xcal-scene，见 S2 CI 规则）。
xcal-scene = { path = "../../scene/xcal-scene", default-features = false }
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
glam.workspace = true
# N6：GPU 像素级验收要构造真实 ECS 场景（`record_scene_tagged` 的入参是
# `SceneRead`，hecs 侧适配器 `WorldView` 需要 `&hecs::World`）——**仅测试用**。
hecs.workspace = true

[[example]]
name = "cube_3d"
required-features = ["egui-wgpu"]

[features]
# 默认启用 wgpu：让 `cargo test -p xcal-render-backends`（顶点契约 V6 验收命令）
# 能编译并运行 vertex_layout 翻译层测试；纯翻译层测试不创建 GPU 实例，headless 可跑。
default = ["wgpu"]
wgpu = ["dep:wgpu", "dep:pollster", "xcal-render/wgpu"]
# S2：eframe/egui 宿主适配（EframeWgpuBackend + install_standard_backends）。
# **默认关闭**：浏览器产物绝不带 egui 链（本阶段不做 UI）。
# native 宿主（xcal-gui）显式开启；签名为 `egui-wgpu` 的纯回调仍在 egui-wgpu 下。
eframe = ["egui-wgpu"]
# egui + wgpu 集成（egui_wgpu 回调、EframeWgpuBackend、RenderContext）。
# `dep:egui` 为必需项——回调整合依赖 egui 类型。
egui-wgpu = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wgpu",
    "dep:pollster",
    "xcal-render/wgpu",
]
# 文本引擎（Typst/LaTeX）预留。
text = []
