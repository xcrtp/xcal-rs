[package]
name = "xcal-render-backends"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xcal-scene = { path = "../xcal-scene", default-features = false }
xcal-render = { path = "../xcal-render", default-features = false }
xc-geometry = { path = "../../kernel/xc-geometry" }

glam.workspace = true
hecs.workspace = true
thiserror.workspace = true
pollster = { workspace = true, optional = true }

# wgpu / egui 均为可选：按 feature 组合提供后端实现。
wgpu = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[dev-dependencies]
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
glam.workspace = true

[[example]]
name = "cube_3d"
required-features = ["egui-wgpu"]

[features]
# 默认启用 wgpu：让 `cargo test -p xcal-render-backends`（顶点契约 V6 验收命令）
# 能编译并运行 vertex_layout 翻译层测试；纯翻译层测试不创建 GPU 实例，headless 可跑。
# 默认启用 cpu-2d：CPU 2D 管线（`EguiPainter`）是默认行为，关闭需显式裁剪 feature。
default = ["wgpu", "cpu-2d"]
wgpu = ["dep:wgpu", "dep:pollster", "xcal-render/wgpu"]
# CPU 2D 管线（`egui_2d` 模块 / `EguiPainter`）：**编译期** feature。
# 与之对应的**运行期**开关是 `xcal_egui::UiConfig::gpu_2d`（面板 checkbox），二者语义不同：
# 本 feature 决定该回放路径是否被编译进来，`gpu_2d` 决定当帧是否真的走 GPU 离屏路径。
# 关闭本 feature 时 `egui_2d` 不被编译，`UiConfig::gpu_2d = false` 将无可回放路径。
cpu-2d = ["dep:egui"]
# 旧 feature 名，保留为等价别名（`text` 之外的既有依赖声明仍可用）。
egui = ["cpu-2d"]
# egui + wgpu 集成（egui_wgpu 回调、EframeWgpuBackend、RenderContext）。
egui-wgpu = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wgpu",
    "dep:pollster",
    "xcal-render/wgpu",
]
# 文本引擎（Typst/LaTeX）预留。
text = []
