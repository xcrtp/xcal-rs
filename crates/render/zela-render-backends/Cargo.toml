[package]
name = "zela-render-backends"

version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zela-render = { path = "../zela-render", default-features = false }
ze-notion = { path = "../../kernel/ze-notion" }
# 场景对象层：相机与图元（Camera2D / Camera3D / Projection / Rect / …）的定义在此。
ze-scene-core = { path = "../../scene/ze-scene-core" }
# S2：图层合成概念与 3D 渲染描述符已下沉渲染 IR 层；后端不再直接依赖场景实现。
ze-render-ir = { path = "../../kernel/ze-render-ir" }
# B2-0a：3D 顶点布局契约在 kernel 层声明（VertexLayout::standard_3d），
# 后端只做「契约 → wgpu 类型」的翻译（铁律 4：不改顶点格式）。
ze-vertex = { path = "../../kernel/ze-vertex" }
# B3-0.5e：resource_cache / render_backend 的纯数据部分（GpuHandle / ResourceKey / ...）
# 在 kernel 层；后端 crate 直接依赖它，不再经 zela-render 转口。
ze-resource = { path = "../../kernel/ze-resource" }

thiserror.workspace = true
pollster = { workspace = true, optional = true }
# GPU 测试汇报：直接写 fd 2，绕过 libtest 的线程输出捕获。
# S4：仅 native blocking 构建需要（wasm 构建不编译 gpu_test）。
libc = { workspace = true, optional = true }
# 异步回读（map_async → oneshot → await）；纯 Rust、wasm 可用。
futures-channel = "0.3"

# wgpu / egui 均为可选：按 feature 组合提供后端实现。
wgpu = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[dev-dependencies]
# 仅测试：像素级用例要构造真实 ECS 场景（生产边不得依赖场景实现，见 S2 CI 规则）。
zela-scene-ecs = { path = "../../scene/zela-scene-ecs" }
egui.workspace = true
eframe.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
pollster.workspace = true
# N6：GPU 像素级验收要构造真实 ECS 场景（`record_scene_tagged` 的入参是
# `SceneRead`，hecs 侧适配器 `WorldView` 需要 `&hecs::World`）——**仅测试用**。
hecs.workspace = true
# B3-R：渲染契约探针（`render_pod_probe`）要**真的实现 Pod trait** 并走慢路径。
# 仅 dev 边：生产依赖图仍与 B3-0.5 一致（structure 判据只查生产边）。
ze-pod-core = { path = "../../ze/pod/ze-pod-core" }
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "cube_3d"
required-features = ["egui-wgpu"]

# B3-R 负向编译探针（`examples/send_probe.rs`）：只在显式启用时参与构建。
[[example]]
name = "send_probe"
required-features = ["send-probe"]

[features]
# 默认启用 wgpu：让 `cargo test -p zela-render-backends`（顶点契约 V6 验收命令）
# 能编译并运行 vertex_layout 翻译层测试；纯翻译层测试不创建 GPU 实例，headless 可跑。
default = ["wgpu", "blocking"]
wgpu = ["dep:wgpu"]
# S2：native 同步构造/回读（`pollster::block_on` / `device.poll(wait)`）。
# **wasm 构建必须关闭**（`--no-default-features --features wgpu`）⇒ 相关 API 编译期不存在，
# 不会出现"运行时静默卡死"。
blocking = ["dep:pollster", "dep:libc", "wgpu"]
# S2：eframe/egui 宿主适配（EframeWgpuBackend + install_standard_backends）。
# **默认关闭**：浏览器产物绝不带 egui 链（本阶段不做 UI）。
# native 宿主（zela-gui）显式开启；签名为 `egui-wgpu` 的纯回调仍在 egui-wgpu 下。
eframe = ["egui-wgpu"]
# egui + wgpu 集成（egui_wgpu 回调、EframeWgpuBackend、RenderContext）。
# `dep:egui` 为必需项——回调整合依赖 egui 类型。
egui-wgpu = [
    "dep:egui",
    "dep:egui-wgpu",
    "dep:wgpu",
]
# 文本引擎（Typst/LaTeX）预留。
text = []
# 只用于负向编译探针（`examples/send_probe.rs`）；正常构建 / 测试不启用。
send-probe = []
