[package]
name = "xcal-render"

version.workspace = true
edition.workspace = true
license.workspace = true

# trait + 调度 + 资源管理层。
# 依赖方向：xc-geometry / xcal-core ← xcal-render ← xcal-render-backends
# 本 crate 禁止依赖 egui；wgpu 仅通过 feature "wgpu" 引入（RenderTarget /
# RenderLayer / RenderBackend 等 GPU 抽象需要），纯数据/队列/trait 定义不依赖 wgpu。
[dependencies]
xcal-core = { path = "../xcal-core", default-features = false }
xc-geometry = { path = "../../kernel/xc-geometry" }

glam.workspace = true
derive_more.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
hecs.workspace = true
thiserror.workspace = true

wgpu = { workspace = true, optional = true }

[dev-dependencies]
glam.workspace = true
hecs.workspace = true

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu"]
