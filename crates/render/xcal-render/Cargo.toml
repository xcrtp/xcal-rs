[package]
name = "xcal-render"

version.workspace = true
edition.workspace = true
license.workspace = true

# trait + 调度 + 资源管理层。
# 依赖方向：xc-notion / xcal-scene ← xcal-render ← xcal-render-backends
# 本 crate 禁止依赖 egui；wgpu 仅通过 feature "wgpu" 引入（RenderTarget /
# RenderLayer / RenderBackend 等 GPU 抽象需要），纯数据/队列/trait 定义不依赖 wgpu。
[dependencies]
xcal-scene = { path = "../xcal-scene", default-features = false }
xc-notion = { path = "../../kernel/xc-notion" }
# 渲染 IR 层（Shape2D / Style2D / 样式组件 / 降级 trait）已下沉 kernel/xc-render-ir。
xc-render-ir = { path = "../../kernel/xc-render-ir" }
# 场景对象层（图元 newtype）：Circle / Path / Line / Rect 的定义在此。
xc-object = { path = "../../object/xc-object" }
xc-content = { path = "../../kernel/xc-content" }
# 渲染契约层已下沉 kernel：
#   xc-vertex   ← vertex/（顶点格式契约，纯数据）
#   xc-resource ← resource_cache / render_backend 的纯数据部分（GpuHandle / ResourceKey / ...）
# 本 crate 通过 `pub use xc_vertex as vertex;` 与 shim 模块保留原有公开路径。
xc-vertex = { path = "../../kernel/xc-vertex" }
xc-resource = { path = "../../kernel/xc-resource" }

glam.workspace = true
derive_more.workspace = true
derive-new.workspace = true
derive_builder.workspace = true
hecs.workspace = true
thiserror.workspace = true
# 顶点格式契约（vertex 模块）：VertexLayout 需可序列化（V4，pipeline 变体缓存 key 前置）
serde.workspace = true

wgpu = { workspace = true, optional = true }
lyon_tessellation = "1.0"
lyon_path = "1.0"

[dev-dependencies]
glam.workspace = true
hecs.workspace = true
serde_json.workspace = true

[features]
default = ["wgpu"]
wgpu = ["dep:wgpu"]
