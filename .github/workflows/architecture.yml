name: Architecture

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  check:
    name: Cargo Check + Workspace Analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # `xcal-app` 默认开启 python feature（pyo3）：需要一个带开发头的解释器。
      - name: Install Python (pyo3)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
        shell: bash

      - name: Install cargo-workspace-analyzer
        run: cargo install cargo-workspace-analyzer

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets
        shell: bash

      # kernel 层的 wasm 可编译性是分层的核心承诺之一（跑不上 wasm，分层就没意义）。
      # 此前一直手工验收，本步把它纳入 CI 自动化门禁。
      # 新增 kernel crate 必须加入下面的列表（M2 起含 xc-scene-contract / xc-render-ir）。
      # 例外：`xc-pod-macro` 是 proc-macro crate（永远 host 编译，不产出 wasm 目标），
      # 因此**不加入**本列表，这不是遗漏。
      # 注意：语言适配器 `xc-pod-lua` / `xc-pod-py` **不在此列，勿加** ——
      # mlua 需要 C 工具链、pyo3 需要系统 Python；它们属于 `crates/pod/` 的
      # **语言适配器组**（平台相关），与同一目录下的核心组（平台无关）判据不同。
      # 名字里的 `xc-pod-` 只是前缀：pod 层同时含核心组
      # （xc-pod / xc-pod-binding / xc-pod-macro）与语言适配器组。
      - name: Kernel wasm gate
        run: |
          rustup target add wasm32-unknown-unknown
          for c in xc-notion xc-render-ir xc-scene-contract xc-content xc-time xc-vertex xc-resource xc-macro xc-prerender xc-pod xc-pod-binding; do
            echo "== $c (wasm32-unknown-unknown) =="
            cargo check -p "$c" --target wasm32-unknown-unknown || exit 1
          done
        shell: bash

      # XSB 装配产物门禁（**单列一组**，不混进 kernel 组）：
      # - `xcal-scene-bundle` 依赖 `xcal-scene`（非 kernel 层），但浏览器方案要求
      #   "浏览器只读 bundle"，因此它必须能编到 wasm32 —— 这里独立验证；
      # - `xcal-compile` **不在**此列：它是 Native 侧编译器，依赖 `xcal-app`
      #   → `xc-pod-lua`（mlua），按既定口径不属于 wasm 目标。
      - name: XSB bundle wasm gate
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p xcal-scene-bundle --target wasm32-unknown-unknown
        shell: bash

      # S1：渲染后端是浏览器路径**唯一**需要改的 crate —— 必须能编到 wasm32。
      # 默认 features = ["wgpu"]（webgpu backend）；`eframe`（egui 链）默认关闭，
      # 故本步不会把 UI 依赖带进浏览器产物。
      - name: Render backends wasm gate
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p xcal-render-backends --target wasm32-unknown-unknown
        shell: bash

      # 结构性判据：`crates/pod/` 下任一 crate 的**生产依赖边**中不得出现任何 `xcal-*`。
      # 这把「领域无关、可独立演进」从口号变成 CI 会拦的规则（覆盖全部 5 个 pod crate，
      # 含两个语言适配器）。dev 边（测试用 mini domain pod）不计入。
      - name: Pod layer is domain-agnostic
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          # 用 crate 名精确圈定 pod 层（新增 pod crate 必须加入此列表）；
          # 依赖名的 `xcal-` 前缀是领域层的唯一判据。dev 边（kind = "dev"）不计入。
          jq -r '
            .packages[]
            | select(.name | IN("xc-pod", "xc-pod-binding", "xc-pod-macro",
                                "xc-pod-lua", "xc-pod-py", "xc-pod-tests"))
            | .name as $n
            | .dependencies[]
            | select(.kind != "dev")
            | select(.name | startswith("xcal-"))
            | "\($n) -> \(.name)"
          ' metadata.json > pod-violations.txt
          if [ -s pod-violations.txt ]; then
            echo "crates/pod 的生产依赖边中出现了 xcal-*（违反领域无关规则）："
            cat pod-violations.txt
            exit 1
          fi
          echo "OK: crates/pod 的生产依赖不含任何 xcal-*"
        shell: bash

      - name: Render backends do not depend on scene (S2)
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          # S2：图层合成概念（Layer*）与 3D 渲染描述符已下沉 xc-render-ir / xc-object。
          # `xcal-render-backends` 的**生产依赖边**不得再出现 `xcal-scene`
          # （dev 边仅测试使用，不计入）。
          jq -r '
            .packages[]
            | select(.name == "xcal-render-backends")
            | .name as $n
            | .dependencies[]
            | select(.kind != "dev")
            | select(.name == "xcal-scene")
            | "\($n) -> \(.name)"
          ' metadata.json > backends-violations.txt
          if [ -s backends-violations.txt ]; then
            echo "xcal-render-backends 的生产依赖边中出现了 xcal-scene（违反 S2 分层规则）："
            cat backends-violations.txt
            exit 1
          fi
          echo "OK: xcal-render-backends 的生产依赖不含 xcal-scene"
        shell: bash

      - name: Workspace Analyzer (cycles + DAG)
        run: |
          # workspace-analyzer 输出依赖分析表；dev-dependencies 不计入生产边
          # 退出码非零 = 检测到循环或解析失败
          # -o mmd：只输出 Mermaid 文本，不依赖 Mermaid CLI（mmdc）；默认 SVG 需要 mmdc
          cargo-workspace-analyzer -d . -o mmd 2>&1 | tee workspace-analysis.txt
          # 分析表中的 Instability 列 = FanOut/(FanIn+FanOut)；
          # 循环依赖表现为多个 crate FanOut/FanIn 互相指向；
          # 工具本身会打印循环警告
        shell: bash

      # cargo-archtest TBD: 当前版本 (v0.2.3) 为单 crate 内 src/ 模块分层设计,
      # 不支持 workspace 级 crate 分层。待上游提供 workspace 模式后接入。
      #
      # - name: Archtest (TBD)
      #   run: cargo archtest
      #   shell: bash

      - name: Upload Analysis Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-analysis
          path: workspace-analysis.txt
          if-no-files-found: ignore
