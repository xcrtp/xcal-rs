name: Architecture

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # Nightly：跑完整对拍（fourier 216 帧 + storyboard 135 帧）。
  # UTC 18:00 = Asia/Shanghai 02:00。
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

env:
  # 锁版本：此前每次从源码重编译且未锁版本，上游一变 CI 就可能红。
  ANALYZER_VERSION: "0.4.3"

jobs:
  native:
    name: Native check + test + structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      # pyo3（xcal-app 默认 feature）需要带开发头的解释器。
      # CI 有 python3 ⇒ xtask 检测到后走默认 features，与本地降级路径不同。
      - name: Install Python (pyo3)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
        shell: bash

      # 以下步骤统一走 `cargo verify --step …`（命令定义单一真源）。
      - name: Cargo Check Workspace
        run: cargo verify --step check
        shell: bash

      # 单测与 GPU 用例都在这一步；xtask 内固定 `-j 2 --test-threads=1`。
      - name: Cargo Test Workspace
        run: cargo verify --step test
        shell: bash

      # 结构性判据：Pod 层领域无关 / render-backends 不依赖 scene（S2）/
      # 数学入口唯一（M0）。jq 在 ubuntu-latest 预装；缺失时该步会显式跳过。
      - name: Structure gates (pod / backends / glam)
        run: cargo verify --step structure
        shell: bash

      - name: Cache cargo-workspace-analyzer
        id: analyzer-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-workspace-analyzer
          key: cargo-workspace-analyzer-${{ runner.os }}-${{ env.ANALYZER_VERSION }}

      - name: Install cargo-workspace-analyzer (pinned)
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-workspace-analyzer --version "$ANALYZER_VERSION"
        shell: bash

      - name: Workspace Analyzer (cycles + DAG)
        run: |
          # workspace-analyzer 输出依赖分析表；dev-dependencies 不计入生产边
          # 退出码非零 = 检测到循环或解析失败
          # -o mmd：只输出 Mermaid 文本，不依赖 Mermaid CLI（mmdc）；默认 SVG 需要 mmdc
          cargo-workspace-analyzer -d . -o mmd 2>&1 | tee workspace-analysis.txt
        shell: bash

      - name: Upload Analysis Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-analysis
          path: workspace-analysis.txt
          if-no-files-found: ignore

  # 帧像素序列哈希：PR / dev push 跑短路径，main/master push + nightly 跑完整。
  #
  # 边界（不得省略）：
  # 1. 短路径是 smoke test，**不是**完整基线的等价替代。已知跨端浮点分歧
  #    首次出现在 fourier 第 103 帧；PR 的 smoke 只渲前 15 帧 ⇒ 它绿不代表
  #    跨端确定性没问题。main/master push / nightly 必须跑完整对拍。
  # 2. baselines.txt 是**设备相关**的（录于 Windows / RTX 4060 Laptop）。
  #    GitHub 托管 runner 没有 GPU，只能装 Mesa lavapipe 软件 Vulkan；
  #    软件适配器与录制设备的像素哈希不可比。**不得**为了让 CI 变绿而重录基线。
  #    ⇒ CI 只断言 `--script == --bundle`（同机自洽，带 `--skip-baseline`），
  #    不比对 baselines.txt；基线回归由录制设备（RTX 4060）上的 `cargo verify` 负责。
  #    若要让 CI 也校验基线：把仓库变量 `XCAL_HASH_RUNNER` 指向与录制设备一致的
  #    runner，并去掉两个步骤里的 `--skip-baseline`。
  hashes:
    name: Frame hash (smoke on PR/dev, full on main/master+nightly)
    runs-on: ${{ vars.XCAL_HASH_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # 对拍固定 `--no-default-features --features typst`（与基线录制组合一致），
          # 与 native job 的默认 features 产物不同，单独一份缓存避免互相冲刷。
          shared-key: hashes

      # GitHub 托管的 Linux runner 无 GPU：装 Vulkan loader + lavapipe，让 headless wgpu
      # 能拿到一个软件 adapter（否则 `RenderContext::headless` 直接失败）。
      # 指定了 XCAL_HASH_RUNNER（自托管 GPU 机器）时不执行这一步。
      - name: Install Vulkan software driver (lavapipe)
        if: runner.os == 'Linux' && vars.XCAL_HASH_RUNNER == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
        shell: bash

      - name: Frame hash smoke (PR / dev push)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == 'dev')
        run: cargo verify --step smoke --skip-baseline
        shell: bash

      - name: Frame hash full (main/master push / nightly / dispatch)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master'))
        run: cargo verify --step hashes --skip-baseline
        shell: bash

  wasm:
    name: wasm gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      # kernel 组 / XSB bundle / render-backends / playback 四组 gate 都在
      # xtask 的 wasm step 内；每个 crate 会先打印 `== <crate> ==` 便于定位。
      - name: wasm gates
        run: cargo verify --step wasm
        shell: bash

