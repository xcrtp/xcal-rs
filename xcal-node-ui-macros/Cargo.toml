[package]
name = "xcal-node-ui-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macro support for xcal-node-ui: #[derive(NodeSpec)] + #[property]."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

[dev-dependencies]
xcal-node-ui = { path = "../xcal-node-ui" }
xcal-node = { path = "../xcal-node" }
xcal-graph-eval = { path = "../xcal-graph-eval" }
xcal-graph-algo = { path = "../xcal-graph-algo" }
